[project]
name = "langchain-file-explorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vatsan127", email = "vatsan127@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
